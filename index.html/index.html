<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GL Games - Scatter Pa More</title>
<style>
body{background:#0f0f1a;color:white;text-align:center;font-family:Arial;padding:20px}
h1{color:#ffd700;font-size:32px}
.box{background:#1e1e35;border:2px solid #ffd700;border-radius:15px;padding:20px;max-width:400px;margin:auto}
.reels{font-size:55px;margin:20px 0}
button{background:#ffd700;color:black;border:none;padding:15px 30px;font-size:20px;font-weight:bold;border-radius:10px}
#msg{margin-top:15px;font-size:18px;color:#00ff88}
.bal{font-size:20px;margin:10px}
</style>
</head>
<body>
<h1>🎰 GL GAMES</h1>
<p>by Gany50ph</p>
<div class="box">
<h2>SCATTER PA MORE!</h2>
<div class="bal">💰 Balance: <span id="bal">1000</span></div>
<div class="reels"><span id="r1">🍒</span> <span id="r2">⭐</span> <span id="r3">💎</span></div>
<button onclick="spin()">SPIN - 50</button>
<div id="msg">Good Luck Bro! Pindutin mo SPIN!</div>
</div>
<script>
let bal=1000;
let sym=["🍒","⭐","💎","🔔","🍋","7️⃣","💰"];
function spin(){
if(bal<50){document.getElementById('msg').innerText="Wala ka ng coins! Refresh mo!";return;}
bal-=50;
let a=sym[Math.floor(Math.random()*sym.length)];
let b=sym[Math.floor(Math.random()*sym.length)];
let c=sym[Math.floor(Math.random()*sym.length)];
document.getElementById('r1').innerText=a;
document.getElementById('r2').innerText=b;
document.getElementById('r3').innerText=c;
let msg="";
if(a==b && b==c){bal+=500;msg="🎉 JACKPOT! +500! SCATTER PA MORE!";}
else if(a==b||b==c||a==c){bal+=100;msg="👏 Nice! +100!";}
else{msg="Sayang! Spin ulit!";}
document.getElementById('bal').innerText=bal;
document.getElementById('msg').innerText=msg;
}
</script>
</body>
</html>
